<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBD Dhaka District South | The Grand Harmony 2026</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Clean Corporate Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        harmonyIndigo: '#14113A',
                        harmonyMidnight: '#0B0924',
                        harmonyViolet: '#241B5E',
                        harmonyLime: '#9EF01A',
                        harmonyLimeDark: '#70B800',
                        accentGold: '#D4AF37',
                    }
                }
            }
        }
    </script>
    <style>
        .ambient-bg {
            background-color: #0B0924;
            background-image:
                linear-gradient(155deg, rgba(11, 9, 36, 0.90) 0%, rgba(20, 17, 58, 0.86) 55%, rgba(11, 9, 36, 0.93) 100%),
                url('https://github.com/fazliyrabby-commits/bg-1/blob/main/bg%404x.png?raw=true');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
        }

        .ambient-pattern-layer {
            position: fixed;
            inset: 0;
            background-image: url('https://github.com/fazliyrabby-commits/bg-2-/blob/main/pattern%404x.png?raw=true');
            background-size: 520px auto;
            background-repeat: repeat;
            opacity: 0.14;
            pointer-events: none;
            z-index: 0;
            animation: patternDrift 28s linear infinite;
        }

        @keyframes patternDrift {
            0% { background-position: 0px 0px; }
            100% { background-position: 520px 260px; }
        }

        .rhythm-wave-layer {
            position: fixed;
            inset: 0;
            background-image: url('https://github.com/fazliyrabby-commits/line-aliment-/blob/main/rythm%404x.png?raw=true');
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: 115% auto;
            opacity: 0.16;
            pointer-events: none;
            z-index: 0;
            animation: rhythmFloat 9s ease-in-out infinite;
        }

        @keyframes rhythmFloat {
            0%, 100% {
                transform: translateY(0px) scale(1);
                opacity: 0.14;
            }
            50% {
                transform: translateY(-10px) scale(1.02);
                opacity: 0.22;
            }
        }

        .music-eq-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            opacity: 0.18;
        }

        .eq-bar {
            position: absolute;
            bottom: 0;
            width: 6px;
            border-radius: 999px 999px 0 0;
            background: linear-gradient(to top, rgba(158, 240, 26, 0.55), rgba(212, 175, 55, 0.08));
            animation: eqPulse var(--dur, 3.2s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes eqPulse {
            0%, 100% { height: 24px; transform: translateY(0); }
            50% { height: var(--peak, 110px); transform: translateY(-8px); }
        }

        /* Curtain Overlay */
        #introOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 1rem;
            background-color: #0B0924;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .curtain-panel {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50.5%;
            background: linear-gradient(145deg, #0B0924 0%, #19144A 55%, #0F0C2E 100%);
            z-index: 10;
            transition: transform 1.15s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.75);
        }

        #curtainLeft {
            left: 0;
            border-right: 1.5px solid rgba(158, 240, 26, 0.35);
        }

        #curtainRight {
            right: 0;
            border-left: 1.5px solid rgba(158, 240, 26, 0.35);
        }

        .curtain-rhythm-accent {
            position: absolute;
            top: 15%;
            bottom: 15%;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(158, 240, 26, 0.65), rgba(212, 175, 55, 0.55), transparent);
            animation: curtainGlow 3s ease-in-out infinite;
        }

        @keyframes curtainGlow {
            0%, 100% { opacity: 0.35; transform: scaleY(0.92); }
            50% { opacity: 0.95; transform: scaleY(1.04); }
        }

        .curtains-open #curtainLeft {
            transform: translateX(-100%);
        }

        .curtains-open #curtainRight {
            transform: translateX(100%);
        }

        #revealStage {
            position: relative;
            z-index: 5;
            opacity: 0;
            transform: scale(0.94) translateY(12px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .stage-visible #revealStage {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #9EF01A;
            box-shadow: 0 0 8px #9EF01A, 0 0 14px rgba(212, 175, 55, 0.7);
            opacity: 0;
            pointer-events: none;
            animation: floatSparkle 3.8s ease-in-out infinite;
        }

        @keyframes floatSparkle {
            0% { transform: translateY(20px) scale(0.4); opacity: 0; }
            40% { opacity: 0.85; }
            80% { opacity: 0.45; }
            100% { transform: translateY(-75px) scale(1.1); opacity: 0; }
        }

        .
